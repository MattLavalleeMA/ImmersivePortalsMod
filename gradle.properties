# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.parallel=false

# Mod Properties
# don't forget to change changelog.md after bumping version
mod_version=6.0.6
maven_group=qouteall
archives_base_name=immersive-portals

modmenu_version=18.0.0
cloth_config_version=26.1.154
sodium_path=maven.modrinth:sodium:mc26.1.2-0.9.1-fabric
iris_path=maven.modrinth:iris:1.11.2+26.1-fabric
# GravityChanger's upstream repo is archived and has no release beyond mc1.20.4;
# it is unmaintained and cannot yet support 26.1. Kept disabled until forked/replaced.
gravity_changer_version=cd4e3377
# DimLib (iPortalTeam/DimLib) is archived upstream with no 26.1-compatible release.
# Its source has been imported directly into this repo as a module
# (src/main/java/qouteall/dimlib) rather than maintained as a separate fork/dependency
# — see docs/migration-26.1-plan.md. midnightlib is DimLib's own config-screen dependency.
midnightlib_version=1.9.3+26.1-fabric
enable_sodium=true
enable_iris=true
enable_pehkui=false
enable_gravity_changer=false
enable_test_mod=false
enable_geckolib=false

# don't forget to update this if branch changes
git_branch=26.1

minecraft_version=26.1.2
loader_version=0.19.3

# Fabric API
fabric_version=0.154.2+26.1.2

